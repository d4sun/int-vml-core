# Local development only. Secrets are supplied as environment variables in
# compose.yaml (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

# The CLI in the init container reaches the node by this name.
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
