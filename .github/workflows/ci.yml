name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vml_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vml_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vml_test
      JOBS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vml_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vml_test
      EMAIL_OUTBOX_DIR: .tmp/email-outbox
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Prettier (changed files)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="HEAD^..HEAD"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$RANGE" \
            | grep -E '\.(ts|tsx|js|mjs|cjs|json|md|css|ya?ml)$' || true)
          if [ -n "$FILES" ]; then
            printf '%s\n' "$FILES" | xargs pnpm exec prettier --check
          fi
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
      - name: Migration status
        run: pnpm exec prisma migrate status
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Build
        run: pnpm build

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Detect Playwright
        id: playwright
        run: |
          if ls playwright.config.* >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install browsers
        if: steps.playwright.outputs.enabled == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e
        if: steps.playwright.outputs.enabled == 'true'
        run: pnpm test:e2e
      - name: No Playwright config yet
        if: steps.playwright.outputs.enabled != 'true'
        run: echo "Playwright is not configured yet; E0-S1-07 activates this job."
